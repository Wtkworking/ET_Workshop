<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้ดูแล: ตอบคำถามท้ายคลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap wide">
  <header class="topbar">
    <h1>หน้าผู้ดูแล</h1>
    <div class="row">
      <span class="muted" id="who"></span>
      <button class="btn ghost" id="logoutBtn" hidden>ออกจากระบบ</button>
    </div>
  </header>

  <!-- เข้าสู่ระบบ -->
  <section class="panel" id="login" hidden style="max-width:460px">
    <h2>เข้าสู่ระบบผู้ดูแล</h2>
    <label for="email">อีเมล</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password" style="margin-top:12px">รหัสผ่าน</label>
    <input type="password" id="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="loginBtn">เข้าสู่ระบบ</button>
    </div>
    <div class="error" id="loginError" hidden></div>
  </section>

  <section id="app" hidden>
    <div class="row" style="justify-content:space-between; margin-bottom:16px">
      <div class="tabs" id="tabs" role="tablist" style="margin:0"></div>
      <span class="phase" id="phase"></span>
    </div>

    <!-- จอฉาย: ส่วนนี้คือสิ่งที่นักเรียนเห็นบนโปรเจกเตอร์ -->
    <div class="stage" id="stage">
      <!-- 1) คลิป -->
      <div id="videoBox">
        <div class="video" id="videoHolder"></div>
        <div class="note" id="videoNote"></div>
      </div>

      <!-- 2) QR ให้สแกน -->
      <div id="qrBox" hidden>
        <div class="qrwrap">
          <div class="qr" id="qrBig"></div>
          <div class="qrtext">
            <p class="big">สแกนเพื่อตอบคำถาม</p>
            <p class="muted link" id="qrLink"></p>
            <p style="margin:24px 0 4px" class="muted">เข้าร่วมแล้ว</p>
            <div class="count"><span id="joinedBig">0</span> คน</div>
          </div>
        </div>
      </div>

      <!-- 3) คำถาม ผลตอบ และคะแนน -->
      <div id="liveBox" hidden>
        <div class="livehead">
          <h2 id="question"></h2>
          <div class="qr small" id="qrSmall"></div>
        </div>
        <div class="timer" id="timer" hidden>
          <div class="num" id="timerNum"></div>
          <div class="track"><div class="fill" id="timerFill"></div></div>
        </div>
        <div class="tiles" id="tiles"></div>
        <div class="answered" id="answered"></div>
        <table class="board" id="board" hidden>
          <thead><tr><th>อันดับ</th><th>ชื่อ</th><th class="n" id="scoreHead">คะแนน</th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ปุ่มควบคุม -->
    <div class="panel" style="margin-top:16px">
      <div class="row">
        <button class="btn ghost" id="qrBtn">แสดง QR</button>
        <button class="btn" id="startBtn">เปิดรับคำตอบ</button>
        <button class="btn ghost" id="closeBtn">ปิดรับคำตอบ</button>
        <button class="btn ghost" id="revealBtn">เฉลย</button>
        <button class="btn" id="nextBtn">ข้อถัดไป</button>
        <button class="btn danger" id="resetBtn">เริ่มรอบใหม่</button>
        <button class="btn ghost" id="fullBtn" style="margin-left:auto">ฉายเต็มจอ</button>
      </div>
      <div class="error" id="ctrlError" hidden></div>

      <details class="settings">
        <summary>ตั้งค่าของสาขานี้ (ตั้งก่อนเริ่มฉาย เพราะจอนี้นักเรียนมองเห็น)</summary>
        <div class="row" style="margin-top:12px">
          <div style="flex:2; min-width:220px">
            <label>ข้อที่ถูก</label>
            <div class="row" id="correctBox"></div>
          </div>
          <div style="flex:1; min-width:160px">
            <label for="secondsSel">เวลาตอบ</label>
            <select id="secondsSel">
              <option value="10">10 วินาที</option>
              <option value="20">20 วินาที</option>
              <option value="30">30 วินาที</option>
              <option value="60">60 วินาที</option>
            </select>
          </div>
        </div>
      </details>
    </div>
  </section>

  <div class="error" id="fatal" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="quiz-config.js"></script>
<script>
(function () {
  var cfg = window.QUIZ_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var keys = Object.keys(cfg.branches);
  var bKey = keys[0];
  var db, offset = 0, refs = [];
  var session = { phase: 'waiting' }, players = {}, answers = {}, correctMap = {};
  var questions = [];
  function curKey() { return session.qKey || 'q0'; }
  function curIndex() { var i = parseInt(curKey().slice(1), 10); return i >= 0 && i < questions.length ? i : 0; }
  var showQr = false;       // true = คลิปจบแล้ว กำลังโชว์ QR
  var media = null;         // ตัวเล่นคลิปของสาขาที่เลือก { pause, restart, destroy }
  var PHASE_LABEL = { waiting: 'รอเริ่ม', open: 'กำลังรับคำตอบ', closed: 'ปิดรับคำตอบแล้ว', reveal: 'เฉลยแล้ว' };

  function now() { return Date.now() + offset; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function showError(id, msg) { $(id).textContent = msg; $(id).hidden = !msg; }
  function viewerUrl() { return new URL('index.html?b=' + bKey, location.href).href; }

  try {
    firebase.initializeApp(cfg.firebase);
    db = firebase.database();
  } catch (e) {
    showError('fatal', 'เชื่อมต่อระบบไม่ได้ ตรวจค่า firebase ในไฟล์ quiz-config.js');
    return;
  }

  // ---------- เข้าสู่ระบบ ----------
  function login() {
    showError('loginError', '');
    firebase.auth().signInWithEmailAndPassword($('email').value.trim(), $('password').value)
      .catch(function (e) {
        var code = (e && e.code) || '';
        var msg = 'เข้าสู่ระบบไม่สำเร็จ';
        if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') msg = 'อีเมลหรือรหัสผ่านไม่ตรงกับบัญชีใน Firebase';
        else if (code === 'auth/invalid-email') msg = 'รูปแบบอีเมลไม่ถูกต้อง';
        else if (code === 'auth/operation-not-allowed') msg = 'ยังไม่ได้เปิด Email/Password ใน Firebase';
        else if (code === 'auth/too-many-requests') msg = 'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';
        else if (code === 'auth/network-request-failed') msg = 'เชื่อมต่อ Firebase ไม่ได้ ตรวจอินเทอร์เน็ต';
        else if (code.indexOf('api-key') !== -1) msg = 'ค่า apiKey ใน quiz-config.js ไม่ถูกต้อง';
        showError('loginError', msg + ' [' + (code || (e && e.message) || 'ไม่ทราบสาเหตุ') + ']');
      });
  }
  $('loginBtn').addEventListener('click', login);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('logoutBtn').addEventListener('click', function () { firebase.auth().signOut(); });

  firebase.auth().onAuthStateChanged(function (user) {
    detach();
    if (!user || user.isAnonymous) {
      if (media) { media.destroy(); media = null; }
      $('login').hidden = false; $('app').hidden = true; $('logoutBtn').hidden = true; $('who').textContent = '';
      return;
    }
    db.ref('admins/' + user.uid).once('value').then(function (s) {
      if (s.val() !== true) throw new Error('not-admin');
      $('login').hidden = true; $('app').hidden = false; $('logoutBtn').hidden = false;
      $('who').textContent = user.email;
      db.ref('.info/serverTimeOffset').on('value', function (x) { offset = x.val() || 0; });
      buildTabs();
      selectBranch(bKey);
    }).catch(function (e) {
      var denied = e && /permission/i.test(String(e.code || e.message));
      showError('loginError', denied
        ? 'เข้าสู่ระบบได้ แต่ฐานข้อมูลไม่ให้อ่าน: ยังไม่ได้วางกฎจาก database.rules.json ในแท็บ Rules แล้วกด Publish'
        : 'เข้าสู่ระบบได้ แต่บัญชีนี้ยังไม่มีสิทธิ์ผู้ดูแล: ในฐานข้อมูลต้องมี admins > ' + user.uid + ' มีค่า true (ไม่มีเครื่องหมายคำพูด)');
      $('login').hidden = false; $('app').hidden = true;
    });
  });

  // ---------- คลิป: YouTube / ไฟล์ mp4 / Google Drive ----------
  var ytReady = false, ytQueue = null;
  window.onYouTubeIframeAPIReady = function () { ytReady = true; if (ytQueue) { ytQueue(); ytQueue = null; } };

  function onClipEnded() {
    if ((session.phase || 'waiting') !== 'waiting') return;
    showQr = true;
    render();
  }

  function mountVideo(br) {
    if (media) { media.destroy(); media = null; }
    var holder = $('videoHolder');
    holder.innerHTML = '';
    $('videoNote').textContent = '';

    if (br.videoId) {
      var slot = el('div'); slot.id = 'ytSlot'; holder.appendChild(slot);
      var yt = null, dead = false;
      var make = function () {
        if (dead) return;
        yt = new YT.Player('ytSlot', {
          videoId: br.videoId,
          playerVars: { rel: 0, playsinline: 1 },
          events: { onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) onClipEnded(); } }
        });
      };
      if (ytReady) make();
      else {
        ytQueue = make;
        if (!document.getElementById('ytApi')) {
          var tag = el('script'); tag.id = 'ytApi'; tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        }
      }
      media = {
        pause: function () { try { yt && yt.pauseVideo(); } catch (e) {} },
        restart: function () { try { yt && yt.seekTo(0); yt && yt.pauseVideo(); } catch (e) {} },
        destroy: function () { dead = true; try { yt && yt.destroy(); } catch (e) {} }
      };
      $('videoNote').textContent = 'เมื่อคลิปจบ QR จะขึ้นเอง';
    } else if (br.videoFile) {
      var v = el('video');
      v.src = br.videoFile; v.controls = true; v.playsInline = true; v.preload = 'metadata';
      v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
      v.addEventListener('ended', onClipEnded);
      holder.appendChild(v);
      media = {
        pause: function () { v.pause(); },
        restart: function () { v.pause(); v.currentTime = 0; },
        destroy: function () { v.pause(); v.removeAttribute('src'); v.load(); }
      };
      $('videoNote').textContent = 'เมื่อคลิปจบ QR จะขึ้นเอง';
    } else if (br.driveId) {
      var src = 'https://drive.google.com/file/d/' + encodeURIComponent(br.driveId) + '/preview';
      var f = el('iframe');
      f.src = src; f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.style.border = '0';
      holder.appendChild(f);
      media = {
        pause: function () { f.src = 'about:blank'; },          // Drive สั่งหยุดจากภายนอกไม่ได้ จึงถอดคลิปออก
        restart: function () { f.src = src; },
        destroy: function () { f.src = 'about:blank'; }
      };
      $('videoNote').textContent = 'คลิปจาก Google Drive ตรวจไม่ได้ว่าจบเมื่อไร เมื่อคลิปจบให้กดปุ่ม "แสดง QR"';
    } else {
      holder.appendChild(el('div', 'center muted', 'ยังไม่ได้ใส่คลิปของสาขานี้ใน quiz-config.js'));
      holder.firstChild.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;color:#fff';
    }
  }

  // ---------- QR ----------
  function drawQr(target, size) {
    target.innerHTML = '';
    if (typeof QRCode === 'undefined') { target.textContent = 'โหลดตัวสร้าง QR ไม่ได้'; return; }
    new QRCode(target, { text: viewerUrl(), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  }

  // ---------- เลือกสาขา ----------
  function buildTabs() {
    $('tabs').innerHTML = '';
    keys.forEach(function (k) {
      var b = el('button', 'tab', k);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.dataset.k = k;
      b.addEventListener('click', function () { selectBranch(k); });
      $('tabs').appendChild(b);
    });
  }

  function detach() {
    refs.forEach(function (r) { r.off(); });
    refs = [];
  }

  function listen(path, cb) {
    var r = db.ref(path);
    r.on('value', function (s) { cb(s.val()); render(); });
    refs.push(r);
  }

  function selectBranch(k) {
    detach();
    bKey = k;
    session = { phase: 'waiting' }; players = {}; answers = {}; correctMap = {}; showQr = false;
    questions = window.quizQuestions(cfg.branches[k]);
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false');
    });
    var br = cfg.branches[k];
    $('qrLink').textContent = viewerUrl();
    drawQr($('qrBig'), 640);
    drawQr($('qrSmall'), 240);
    mountVideo(br);

    var box = $('correctBox');
    box.innerHTML = '';
    questions.forEach(function (q, i) {
      var sel = el('select');
      sel.id = 'correct-q' + i;
      sel.setAttribute('aria-label', 'ข้อที่ถูกของข้อ ' + (i + 1));
      sel.style.cssText = 'width:auto; flex:1; min-width:110px';
      sel.appendChild(new Option((questions.length > 1 ? 'ข้อ ' + (i + 1) + ': ' : '') + 'ยังไม่ได้ตั้ง', ''));
      q.options.forEach(function (o) {
        sel.appendChild(new Option((questions.length > 1 ? 'ข้อ ' + (i + 1) + ': ' : 'ข้อ ') + o.key, o.key));
      });
      sel.addEventListener('change', function () {
        db.ref('private/' + bKey + '/correct/q' + i).set(sel.value || null).catch(fail);
      });
      box.appendChild(sel);
    });
    $('secondsSel').value = String(cfg.answerSeconds);
    if (!$('secondsSel').value) $('secondsSel').value = '20';
    showError('ctrlError', '');

    listen('sessions/' + k, function (v) { session = v || { phase: 'waiting' }; });
    listen('players/' + k, function (v) { players = v || {}; });
    listen('answers/' + k, function (v) { answers = v || {}; });
    listen('private/' + k + '/correct', function (v) {
      correctMap = typeof v === 'string' ? { q0: v } : (v || {});
      questions.forEach(function (q, i) {
        var sel = $('correct-q' + i);
        if (sel) sel.value = correctMap['q' + i] || '';
      });
    });
    render();
  }

  // ---------- ปุ่มควบคุม ----------
  function fail(e) { showError('ctrlError', 'บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ตรวจการเชื่อมต่อ')); }

  $('qrBtn').addEventListener('click', function () {
    showQr = !showQr;
    if (showQr) { if (media) media.pause(); }
    else if (media) media.restart();
    render();
  });

  function openQuestion(index) {
    showError('ctrlError', '');
    if (media) media.pause();
    return db.ref('sessions/' + bKey).update({
      phase: 'open',
      qKey: 'q' + index,
      correct: null,
      openedAt: firebase.database.ServerValue.TIMESTAMP,
      duration: Number($('secondsSel').value)
    }).catch(fail);
  }
  $('startBtn').addEventListener('click', function () { openQuestion(0); });
  $('nextBtn').addEventListener('click', function () {
    if (curIndex() < questions.length - 1) openQuestion(curIndex() + 1);
  });

  function closeRound() {
    return db.ref('sessions/' + bKey + '/phase').set('closed').catch(fail);
  }
  $('closeBtn').addEventListener('click', closeRound);

  $('revealBtn').addEventListener('click', function () {
    var key = curKey(), c = correctMap[key];
    if (!c) { showError('ctrlError', 'ตั้ง "ข้อที่ถูก" ของข้อ ' + (curIndex() + 1) + ' ในส่วนตั้งค่าก่อนกดเฉลย'); return; }
    showError('ctrlError', '');
    var up = { phase: 'reveal', correct: c };
    up['revealed/' + key] = { correct: c, openedAt: session.openedAt || 0, duration: session.duration || 1 };
    db.ref('sessions/' + bKey).update(up).catch(fail);
  });

  $('resetBtn').addEventListener('click', function () {
    if (!confirm('ล้างคำตอบและรายชื่อผู้เข้าร่วมของสาขา ' + bKey + ' แล้วเริ่มรอบใหม่?')) return;
    showError('ctrlError', '');
    showQr = false;
    if (media) media.restart();
    db.ref('answers/' + bKey).remove()
      .then(function () { return db.ref('players/' + bKey).remove(); })
      .then(function () { return db.ref('sessions/' + bKey).set({ phase: 'waiting' }); })
      .catch(fail);
  });

  $('fullBtn').addEventListener('click', function () {
    var s = $('stage');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (s.requestFullscreen) s.requestFullscreen();
  });

  // ---------- แสดงผลเรียลไทม์ ----------
  function render() {
    var br = cfg.branches[bKey];
    var phase = session.phase || 'waiting';
    $('phase').textContent = PHASE_LABEL[phase] || phase;
    $('phase').className = 'phase ' + phase;

    var joined = Object.keys(players).length;
    var key = curKey(), idx = curIndex(), q = questions[idx];
    var cur = answers[key] || {};
    var aIds = Object.keys(cur);
    var last = idx >= questions.length - 1;
    $('joinedBig').textContent = joined;

    // เลือกว่าจอฉายแสดงอะไร
    var mode = phase !== 'waiting' ? 'live' : (showQr ? 'qr' : 'video');
    $('videoBox').hidden = mode !== 'video';
    $('qrBox').hidden = mode !== 'qr';
    $('liveBox').hidden = mode !== 'live';

    $('qrBtn').disabled = phase !== 'waiting';
    $('qrBtn').textContent = showQr ? 'กลับไปดูคลิป' : 'แสดง QR';
    $('startBtn').disabled = phase !== 'waiting';
    $('closeBtn').disabled = phase !== 'open';
    $('revealBtn').disabled = !(phase === 'closed' || phase === 'open');
    $('nextBtn').hidden = questions.length < 2;
    $('nextBtn').disabled = !(phase === 'reveal' && !last);
    if (mode !== 'live') return;

    $('question').textContent = (questions.length > 1 ? 'ข้อ ' + (idx + 1) + ' จาก ' + questions.length + ': ' : '') + q.question;
    $('timer').hidden = phase !== 'open';
    $('qrSmall').hidden = phase !== 'open';

    // ระหว่างรับคำตอบไม่โชว์ว่าข้อไหนคนตอบเยอะ เพื่อไม่ให้ชี้นำ
    var showCounts = phase !== 'open';
    var tiles = $('tiles');
    tiles.innerHTML = '';
    q.options.forEach(function (o, i) {
      var t = el('div', 'tile c' + (i % 4));
      t.appendChild(el('span', 'key', o.key));
      t.appendChild(el('span', null, o.text));
      if (showCounts) {
        var n = aIds.filter(function (id) { return cur[id].choice === o.key; }).length;
        t.appendChild(el('span', 'n', String(n)));
      }
      if (phase === 'reveal' && session.correct !== o.key) t.classList.add('dim');
      tiles.appendChild(t);
    });

    $('answered').textContent = phase === 'reveal'
      ? 'ข้อที่ถูกคือ ' + session.correct
      : 'ตอบแล้ว ' + aIds.length + ' จาก ' + Math.max(joined, aIds.length) + ' คน';

    // ตารางคะแนนรวมทุกข้อที่เฉลยแล้ว แสดงหลังเฉลยเท่านั้น
    $('board').hidden = phase !== 'reveal';
    if (phase !== 'reveal') return;
    $('scoreHead').textContent = questions.length > 1 ? (last ? 'คะแนนรวมสุดท้าย' : 'คะแนนรวม') : 'คะแนน';
    var totals = {};
    Object.keys(session.revealed || {}).forEach(function (k) {
      var rev = session.revealed[k], list = answers[k] || {};
      Object.keys(list).forEach(function (id) {
        var a = list[id];
        var t = totals[id] || (totals[id] = { name: a.name, score: 0, time: 0 });
        if (a.choice === rev.correct) t.score += window.quizScore(a.at, rev.openedAt, rev.duration);
        t.time += Math.max(0, a.at - rev.openedAt);
      });
    });
    var rows = Object.keys(totals).map(function (id) { return totals[id]; })
      .filter(function (r) { return r.score > 0; });
    rows.sort(function (x, y) { return (y.score - x.score) || (x.time - y.time); });

    var body = $('boardBody');
    body.innerHTML = '';
    if (!rows.length) {
      var tr0 = el('tr'); var td0 = el('td', 'muted', 'ยังไม่มีใครตอบถูก'); td0.colSpan = 3;
      tr0.appendChild(td0); body.appendChild(tr0);
    }
    rows.slice(0, 10).forEach(function (r, i) {
      var tr = el('tr');
      tr.appendChild(el('td', null, String(i + 1)));
      tr.appendChild(el('td', null, r.name));
      tr.appendChild(el('td', 'n', String(r.score)));
      body.appendChild(tr);
    });
  }

  // นับถอยหลัง และปิดรับคำตอบเองเมื่อหมดเวลา
  var closing = false;
  setInterval(function () {
    if (session.phase !== 'open' || !session.openedAt) { closing = false; return; }
    var dur = session.duration * 1000;
    var left = Math.max(0, session.openedAt + dur - now());
    $('timerNum').textContent = Math.ceil(left / 1000);
    $('timerFill').style.transform = 'scaleX(' + (left / dur) + ')';
    if (left <= 0 && !closing) { closing = true; closeRound(); }
  }, 200);
})();
</script>
</body>
</html>
