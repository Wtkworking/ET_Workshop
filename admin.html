<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้ดูแล: ตอบคำถามท้ายคลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap wide">
  <header class="topbar">
    <h1>หน้าผู้ดูแล</h1>
    <div class="row">
      <span class="muted" id="who"></span>
      <button class="btn ghost" id="logoutBtn" hidden>ออกจากระบบ</button>
    </div>
  </header>

  <!-- เข้าสู่ระบบ -->
  <section class="panel" id="login" hidden style="max-width:460px">
    <h2>เข้าสู่ระบบผู้ดูแล</h2>
    <label for="email">อีเมล</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password" style="margin-top:12px">รหัสผ่าน</label>
    <input type="password" id="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="loginBtn">เข้าสู่ระบบ</button>
    </div>
    <div class="error" id="loginError" hidden></div>
  </section>

  <section id="app" hidden>
    <div class="row" style="justify-content:space-between; margin-bottom:16px">
      <div class="tabs" id="tabs" role="tablist" style="margin:0"></div>
      <span class="phase" id="phase"></span>
    </div>

    <!-- จอฉาย: ส่วนนี้คือสิ่งที่นักเรียนเห็นบนโปรเจกเตอร์ -->
    <div class="stage" id="stage">
      <!-- 1) คลิป -->
      <div id="videoBox">
        <div class="video" id="videoHolder"></div>
      </div>

      <!-- 2) QR ให้สแกน -->
      <div id="qrBox" hidden>
        <div class="qrwrap">
          <div class="qr" id="qrBig"></div>
          <div class="qrtext">
            <p class="big">สแกนเพื่อตอบคำถาม</p>
            <p class="muted link" id="qrLink"></p>
            <p style="margin:24px 0 4px" class="muted">เข้าร่วมแล้ว</p>
            <div class="count"><span id="joinedBig">0</span> คน</div>
          </div>
        </div>
      </div>

      <!-- คำถามอภิปราย (สาขาที่ไม่มีการกดตอบ) -->
      <div id="discussBox" class="discuss" hidden>
        <h2 id="discussTitle"></h2>
        <ol id="discussList"></ol>
      </div>

      <!-- 3) คำถาม ผลตอบ และคะแนน -->
      <div id="liveBox" hidden>
        <div class="livehead">
          <h2 id="question"></h2>
          <div class="qr small" id="qrSmall"></div>
        </div>
        <div class="timer" id="timer" hidden>
          <div class="num" id="timerNum"></div>
          <div class="track"><div class="fill" id="timerFill"></div></div>
        </div>
        <div class="tiles" id="tiles"></div>
        <div class="answered" id="answered"></div>
        <table class="board" id="board" hidden>
          <thead><tr><th>อันดับ</th><th>ชื่อ</th><th class="n" id="scoreHead">คะแนน</th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ปุ่มควบคุม -->
    <div class="panel" style="margin-top:16px">
      <div class="row">
        <button class="btn ghost" id="qrBtn">แสดง QR</button>
        <button class="btn" id="startBtn">เปิดรับคำตอบ</button>
        <button class="btn ghost" id="closeBtn">ปิดรับคำตอบ</button>
        <button class="btn ghost" id="revealBtn">เฉลย</button>
        <button class="btn" id="nextBtn">ข้อถัดไป</button>
        <button class="btn danger" id="resetBtn">เริ่มรอบใหม่</button>
        <button class="btn ghost" id="fullBtn" style="margin-left:auto">ฉายเต็มจอ</button>
      </div>
      <div class="error" id="ctrlError" hidden></div>

      <div class="row" style="margin-top:18px">
        <label for="secondsSel" style="margin:0">เวลาตอบ</label>
        <select id="secondsSel" style="width:auto">
          <option value="10">10 วินาที</option>
          <option value="20">20 วินาที</option>
          <option value="30">30 วินาที</option>
          <option value="60">60 วินาที</option>
        </select>
      </div>
    </div>
  </section>

  <div class="error" id="fatal" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="quiz-config.js"></script>
<script src="quiz-answers.js"></script>
<script>
(function () {
  var cfg = window.QUIZ_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var order = window.quizOrder();   // ลำดับสาขา เช่น DIT, CAI, CYB, AME, IEM, RAE
  var SID = 'main';                 // ทั้งงานใช้รอบเดียวกัน คะแนนสะสมข้ามสาขา
  var bKey = order[0];              // สาขาที่กำลังแสดงบนจอ
  var db, sref, offset = 0, unsubs = [], roundUnsubs = [], listenRound = null, pendingOpen = null;
  var session = blankSession(), players = {}, answers = {}, correctMap = {};
  var KEY = window.QUIZ_ANSWERS || {};   // เฉลยจากไฟล์ quiz-answers.js
  var showQr = false;       // true = คลิปจบแล้ว กำลังโชว์ QR
  var media = null;         // ตัวเล่นคลิปของสาขาที่เลือก { pause, restart, destroy }
  var PHASE_LABEL = { waiting: 'รอเริ่ม', open: 'กำลังรับคำตอบ', closed: 'ปิดรับคำตอบแล้ว', reveal: 'เฉลยแล้ว', discuss: 'อภิปราย' };

  function blankSession() {
    return { phase: 'waiting', branch: '', qKey: '', openedAt: 0, duration: cfg.answerSeconds, correct: null, revealed: {}, final: false, round: '' };
  }
  function newRound() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function now() { return Date.now() + offset; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function showError(id, msg) { $(id).textContent = msg; $(id).hidden = !msg; }
  function viewerUrl() { return new URL('index.html', location.href).href; }

  // ---------- คำถาม: รหัสข้อมีรูปแบบ "สาขา-qลำดับ" เช่น DIT-q0 ----------
  function qs(b) { return window.quizQuestions(cfg.branches[b]); }
  function keyOf(b, i) { return b + '-q' + i; }
  function parseKey(k) {
    var m = /^(.+)-q(\d+)$/.exec(k || '');
    return m && cfg.branches[m[1]] && qs(m[1])[Number(m[2])] ? { b: m[1], i: Number(m[2]) } : null;
  }
  function isScored(b) { return cfg.branches[b].scored !== false; }
  // ข้อถัดไปของสาขาที่ยังไม่ได้เฉลย (-1 = ถามครบแล้ว หรือสาขานี้ไม่มีคำถาม)
  function nextIndex(b) {
    var list = qs(b);
    for (var i = 0; i < list.length; i++) if (!session.revealed[keyOf(b, i)]) return i;
    return -1;
  }
  function nextBranch(b) { var i = order.indexOf(b); return i >= 0 && i < order.length - 1 ? order[i + 1] : null; }
  // ข้อสุดท้ายที่นับคะแนน: เฉลยข้อนี้แล้วถือว่าสรุปผล
  function lastScoredKey() {
    for (var i = order.length - 1; i >= 0; i--) {
      if (isScored(order[i]) && qs(order[i]).length) return keyOf(order[i], qs(order[i]).length - 1);
    }
    return '';
  }
  // คะแนนรวมของทุกคน จากทุกข้อที่เฉลยแล้วและนับคะแนน
  function totals(revealed) {
    var t = {};
    Object.keys(revealed || {}).forEach(function (k) {
      var rev = revealed[k], list = answers[k] || {};
      if (rev.scored === false) return;
      Object.keys(list).forEach(function (id) {
        var a = list[id];
        var row = t[id] || (t[id] = { uid: id, name: a.name, score: 0, time: 0 });
        if (a.choice === rev.correct) row.score += window.quizScore(a.at, rev.openedAt, rev.duration);
        row.time += Math.max(0, a.at - rev.openedAt);
      });
    });
    var rows = Object.keys(t).map(function (id) { return t[id]; }).filter(function (r) { return r.score > 0; });
    rows.sort(function (x, y) { return (y.score - x.score) || (x.time - y.time); });
    return rows;
  }

  try {
    firebase.initializeApp(cfg.firebase);
    db = firebase.firestore();
    sref = db.collection('sessions').doc(SID);
  } catch (e) {
    showError('fatal', 'เชื่อมต่อระบบไม่ได้ ตรวจค่า firebase ในไฟล์ quiz-config.js');
    return;
  }

  // ---------- เข้าสู่ระบบ ----------
  function login() {
    showError('loginError', '');
    firebase.auth().signInWithEmailAndPassword($('email').value.trim(), $('password').value)
      .catch(function (e) {
        var code = (e && e.code) || '';
        var msg = 'เข้าสู่ระบบไม่สำเร็จ';
        if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') msg = 'อีเมลหรือรหัสผ่านไม่ตรงกับบัญชีใน Firebase';
        else if (code === 'auth/invalid-email') msg = 'รูปแบบอีเมลไม่ถูกต้อง';
        else if (code === 'auth/operation-not-allowed') msg = 'ยังไม่ได้เปิด Email/Password ใน Firebase';
        else if (code === 'auth/too-many-requests') msg = 'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';
        else if (code === 'auth/network-request-failed') msg = 'เชื่อมต่อ Firebase ไม่ได้ ตรวจอินเทอร์เน็ต';
        else if (code.indexOf('api-key') !== -1) msg = 'ค่า apiKey ใน quiz-config.js ไม่ถูกต้อง';
        showError('loginError', msg + ' [' + (code || (e && e.message) || 'ไม่ทราบสาเหตุ') + ']');
      });
  }
  $('loginBtn').addEventListener('click', login);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('logoutBtn').addEventListener('click', function () { firebase.auth().signOut(); });

  firebase.auth().onAuthStateChanged(function (user) {
    detach();
    if (!user || user.isAnonymous) {
      if (media) { media.destroy(); media = null; }
      $('login').hidden = false; $('app').hidden = true; $('logoutBtn').hidden = true; $('who').textContent = '';
      return;
    }
    db.collection('admins').doc(user.uid).get().then(function (snap) {
      if (!snap.exists) throw new Error('not-admin');
      $('login').hidden = true; $('app').hidden = false; $('logoutBtn').hidden = false;
      $('who').textContent = user.email;
      start();
    }).catch(function (e) {
      var denied = e && /permission/i.test(String(e.code || e.message));
      showError('loginError', denied
        ? 'เข้าสู่ระบบได้ แต่ Firestore ไม่ให้อ่าน: ยังไม่ได้วางกฎจากไฟล์ firestore.rules ที่ Firestore Database > Rules แล้วกด Publish'
        : 'เข้าสู่ระบบได้ แต่บัญชีนี้ยังไม่มีสิทธิ์ผู้ดูแล: ใน Firestore ต้องมีคอลเลกชัน admins ที่มีเอกสารชื่อ ' + user.uid);
      $('login').hidden = false; $('app').hidden = true;
    });
  });

  // ---------- คลิป: YouTube / ไฟล์ mp4 / Google Drive ----------
  var ytReady = false, ytQueue = null;
  window.onYouTubeIframeAPIReady = function () { ytReady = true; if (ytQueue) { ytQueue(); ytQueue = null; } };

  function onClipEnded() {
    if (session.phase !== 'waiting') return;
    showQr = true;
    render();
  }

  function mountVideo(br) {
    if (media) { media.destroy(); media = null; }
    var holder = $('videoHolder');
    holder.innerHTML = '';

    if (br.videoId) {
      var slot = el('div'); slot.id = 'ytSlot'; holder.appendChild(slot);
      var yt = null, dead = false;
      var make = function () {
        if (dead) return;
        yt = new YT.Player('ytSlot', {
          videoId: br.videoId,
          playerVars: { rel: 0, playsinline: 1 },
          events: { onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) onClipEnded(); } }
        });
      };
      if (ytReady) make();
      else {
        ytQueue = make;
        if (!document.getElementById('ytApi')) {
          var tag = el('script'); tag.id = 'ytApi'; tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        }
      }
      media = {
        pause: function () { try { yt && yt.pauseVideo(); } catch (e) {} },
        restart: function () { try { yt && yt.seekTo(0); yt && yt.pauseVideo(); } catch (e) {} },
        destroy: function () { dead = true; try { yt && yt.destroy(); } catch (e) {} }
      };
    } else if (br.videoFile) {
      var v = el('video');
      v.src = br.videoFile; v.controls = true; v.playsInline = true; v.preload = 'metadata';
      v.addEventListener('ended', onClipEnded);
      holder.appendChild(v);
      media = {
        pause: function () { v.pause(); },
        restart: function () { v.pause(); v.currentTime = 0; },
        destroy: function () { v.pause(); v.removeAttribute('src'); v.load(); }
      };
    } else if (br.driveId) {
      var src = 'https://drive.google.com/file/d/' + encodeURIComponent(br.driveId) + '/preview';
      var f = el('iframe');
      f.src = src; f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.style.border = '0';
      holder.appendChild(f);
      media = {
        pause: function () { f.src = 'about:blank'; },          // Drive สั่งหยุดจากภายนอกไม่ได้ จึงถอดคลิปออก
        restart: function () { f.src = src; },
        destroy: function () { f.src = 'about:blank'; }
      };
    } else {
      var empty = el('div', 'center', 'ยังไม่ได้ใส่คลิปของสาขานี้ใน quiz-config.js');
      empty.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;color:#fff';
      holder.appendChild(empty);
    }
  }

  // ---------- QR ----------
  function drawQr(target, size) {
    target.innerHTML = '';
    if (typeof QRCode === 'undefined') { target.textContent = 'โหลดตัวสร้าง QR ไม่ได้'; return; }
    new QRCode(target, { text: viewerUrl(), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  }

  // ---------- สาขา ----------
  function buildTabs() {
    $('tabs').innerHTML = '';
    order.forEach(function (k) {
      var b = el('button', 'tab', k);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.dataset.k = k;
      b.addEventListener('click', function () {
        if (k === bKey) return;
        if (session.phase === 'open' || session.phase === 'closed') {
          showError('ctrlError', 'ข้อนี้ยังไม่ได้เฉลย กดเฉลยก่อนเปลี่ยนสาขา');
          return;
        }
        setBranch(k, true);
      });
      $('tabs').appendChild(b);
    });
  }

  // เปลี่ยนสาขาที่แสดงบนจอ: โหลดคลิปของสาขานั้น และ (ถ้า write) แจ้งมือถือทุกเครื่องให้กลับไปหน้ารอ
  function setBranch(k, write) {
    bKey = k;
    showQr = false;
    showError('ctrlError', '');
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false');
    });
    mountVideo(cfg.branches[k]);
    if (write) sref.set({ branch: k, phase: 'waiting', final: false }, { merge: true }).catch(fail);
    render();
  }

  function detachRound() {
    roundUnsubs.forEach(function (u) { u(); });
    roundUnsubs = [];
    listenRound = null;
  }
  function detach() {
    detachRound();
    unsubs.forEach(function (u) { u(); });
    unsubs = [];
  }

  // ฟังรายชื่อผู้เข้าร่วมและคำตอบของรอบปัจจุบันเท่านั้น
  function watchRound(r) {
    detachRound();
    listenRound = r;
    players = {}; answers = {};
    roundUnsubs.push(sref.collection('players').where('round', '==', r).onSnapshot(function (list) {
      players = {};
      list.forEach(function (doc) { players[doc.id] = doc.data(); });
      render();
    }, fail));
    roundUnsubs.push(sref.collection('answers').where('round', '==', r).onSnapshot(function (list) {
      answers = {};
      list.forEach(function (doc) {
        var a = doc.data({ serverTimestamps: 'estimate' });
        (answers[a.q] = answers[a.q] || {})[a.uid] = {
          choice: a.choice, name: a.name, at: a.at && a.at.toMillis ? a.at.toMillis() : 0
        };
      });
      render();
    }, fail));
  }

  function start() {
    buildTabs();
    // เฉลยตายตัวจากไฟล์ quiz-answers.js
    order.forEach(function (b) {
      qs(b).forEach(function (q, i) { if (KEY[b] && KEY[b][i]) correctMap[keyOf(b, i)] = KEY[b][i]; });
    });
    $('secondsSel').value = String(cfg.answerSeconds);
    if (!$('secondsSel').value) $('secondsSel').value = '20';
    $('qrLink').textContent = viewerUrl();
    drawQr($('qrBig'), 640);
    drawQr($('qrSmall'), 240);
    setBranch(bKey, false);

    var first = true;
    unsubs.push(sref.onSnapshot(function (snap) {
      var d = snap.exists ? snap.data({ serverTimestamps: 'estimate' }) : null;
      if (!d || !d.round) {
        // ยังไม่เคยใช้: สร้างรอบแรก เริ่มที่สาขาแรก
        sref.set({ phase: 'waiting', round: newRound(), branch: order[0] }, { merge: true }).catch(fail);
        return;
      }
      session = {
        phase: d.phase || 'waiting',
        branch: d.branch || '',
        qKey: d.qKey || '',
        openedAt: d.openedAt && d.openedAt.toMillis ? d.openedAt.toMillis() : 0,
        duration: d.duration || cfg.answerSeconds,
        correct: d.correct || null,
        revealed: d.revealed || {},
        final: !!d.final,
        round: d.round
      };
      if (pendingOpen && session.phase === 'open' && !snap.metadata.hasPendingWrites) {
        // เทียบเวลาที่เซิร์ฟเวอร์บันทึกกับนาฬิกาเครื่องนี้ เพื่อให้ตัวนับถอยหลังตรง
        offset = session.openedAt - (pendingOpen + Date.now()) / 2;
        pendingOpen = null;
      }
      if (first) {
        // เปิดหน้าใหม่กลางงาน: กลับไปที่สาขาที่เล่นค้างอยู่
        first = false;
        if (session.branch && cfg.branches[session.branch] && session.branch !== bKey) setBranch(session.branch, false);
      }
      if (session.round !== listenRound) watchRound(session.round);
      render();
    }, fail));

  }

  // ---------- ปุ่มควบคุม ----------
  function fail(e) { showError('ctrlError', 'บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ตรวจการเชื่อมต่อ')); }

  $('qrBtn').addEventListener('click', function () {
    showQr = !showQr;
    if (showQr) { if (media) media.pause(); }
    else if (media) media.restart();
    render();
  });

  function openQuestion(b, index) {
    showError('ctrlError', '');
    if (media) media.pause();
    pendingOpen = Date.now();
    return sref.set({
      phase: 'open',
      branch: b,
      qKey: keyOf(b, index),
      correct: null,
      final: false,
      openedAt: firebase.firestore.FieldValue.serverTimestamp(),
      duration: Number($('secondsSel').value)
    }, { merge: true }).catch(fail);
  }

  $('startBtn').addEventListener('click', function () {
    var i = nextIndex(bKey);
    if (i >= 0) { openQuestion(bKey, i); return; }
    if (cfg.branches[bKey].discussion && !qs(bKey).length) {
      // สาขาอภิปราย: แสดงคำถามบนจอและมือถือ ไม่มีการกดตอบ
      if (media) media.pause();
      sref.set({ phase: 'discuss', branch: bKey, final: false }, { merge: true }).catch(fail);
    }
  });

  // ปุ่มเดียวทำ 2 หน้าที่: ข้อถัดไปในสาขาเดิม หรือไปสาขาถัดไปเมื่อถามครบ
  $('nextBtn').addEventListener('click', function () {
    var i = nextIndex(bKey);
    if (session.phase === 'reveal' && i >= 0) { openQuestion(bKey, i); return; }
    var nb = nextBranch(bKey);
    if (nb) setBranch(nb, true);
  });

  function closeRound() {
    return sref.set({ phase: 'closed' }, { merge: true }).catch(fail);
  }
  $('closeBtn').addEventListener('click', closeRound);

  $('revealBtn').addEventListener('click', function () {
    var key = session.qKey, p = parseKey(key), c = correctMap[key];
    if (!p) return;
    if (!c) {
      showError('ctrlError', 'ไม่พบเฉลยของ ' + p.b + ' ข้อ ' + (p.i + 1) + ' ในไฟล์ quiz-answers.js');
      return;
    }
    showError('ctrlError', '');
    var rev = {};
    rev[key] = { correct: c, openedAt: session.openedAt || 0, duration: session.duration || 1, scored: isScored(p.b) };
    // คิด 10 อันดับแรกรวมข้อนี้ด้วย ส่งให้มือถือแสดงอันดับของตัวเอง
    var all = {};
    Object.keys(session.revealed).forEach(function (k) { all[k] = session.revealed[k]; });
    all[key] = rev[key];
    var top = totals(all).slice(0, 10).map(function (r) { return { uid: r.uid, name: r.name, score: r.score }; });
    sref.set({ phase: 'reveal', correct: c, revealed: rev, top: top, final: key === lastScoredKey() }, { merge: true }).catch(fail);
  });

  $('resetBtn').addEventListener('click', function () {
    if (!confirm('เริ่มรอบใหม่ทั้งงาน? คะแนนสะสมของทุกสาขาจะถูกล้าง และกลับไปเริ่มที่สาขา ' + order[0])) return;
    // เปลี่ยนรหัสรอบ: ข้อมูลรอบเก่าไม่ถูกนับอีก และมือถือที่ยังเปิดอยู่จะกลับมาลงชื่อในรอบใหม่เอง
    sref.set({ phase: 'waiting', round: newRound(), branch: order[0] }).catch(fail);
    setBranch(order[0], false);
  });

  $('fullBtn').addEventListener('click', function () {
    var s = $('stage');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (s.requestFullscreen) s.requestFullscreen();
  });

  // ---------- แสดงผลเรียลไทม์ ----------
  function render() {
    var phase = session.phase;
    var p = parseKey(session.qKey);
    var disc = cfg.branches[bKey].discussion;
    var discOnly = !!disc && !qs(bKey).length;
    if (phase === 'discuss' && !discOnly) phase = 'waiting';
    if (!p && phase !== 'waiting' && phase !== 'discuss') phase = 'waiting';
    $('phase').textContent = PHASE_LABEL[phase] || phase;
    $('phase').className = 'phase ' + phase;

    var joined = Object.keys(players).length;
    $('joinedBig').textContent = joined;

    // เลือกว่าจอฉายแสดงอะไร
    var mode = phase === 'discuss' ? 'discuss' : phase !== 'waiting' ? 'live' : (showQr ? 'qr' : 'video');
    $('videoBox').hidden = mode !== 'video';
    $('qrBox').hidden = mode !== 'qr';
    $('liveBox').hidden = mode !== 'live';
    $('discussBox').hidden = mode !== 'discuss';
    if (mode === 'discuss') {
      $('discussTitle').textContent = disc.title;
      var ol = $('discussList');
      ol.innerHTML = '';
      disc.points.forEach(function (t) { ol.appendChild(el('li', null, t)); });
    }

    var ni = nextIndex(bKey), nb = nextBranch(bKey);
    $('qrBtn').disabled = phase !== 'waiting';
    $('qrBtn').textContent = showQr ? 'กลับไปดูคลิป' : 'แสดง QR';
    $('startBtn').textContent = discOnly ? 'แสดงคำถามอภิปราย' : 'เปิดรับคำตอบ';
    $('startBtn').disabled = !(phase === 'waiting' && (ni >= 0 || discOnly));
    $('closeBtn').disabled = phase !== 'open';
    $('revealBtn').disabled = !(phase === 'closed' || phase === 'open');
    if (phase === 'reveal' && ni >= 0) {
      $('nextBtn').textContent = 'ข้อถัดไป';
      $('nextBtn').disabled = false;
    } else {
      $('nextBtn').textContent = nb ? 'สาขาถัดไป: ' + nb : 'จบทุกสาขาแล้ว';
      $('nextBtn').disabled = !(nb && ni < 0 && (phase === 'reveal' || phase === 'waiting'));
    }
    if (mode !== 'live') return;

    var list = qs(p.b), q = list[p.i];
    var cur = answers[session.qKey] || {};
    var aIds = Object.keys(cur);
    var rev = session.revealed[session.qKey];
    $('question').textContent = p.b + (list.length > 1 ? ' ข้อ ' + (p.i + 1) + ' จาก ' + list.length : '') + ': ' + q.question;
    $('timer').hidden = phase !== 'open';
    $('qrSmall').hidden = phase !== 'open';

    // ระหว่างรับคำตอบไม่โชว์ว่าข้อไหนคนตอบเยอะ เพื่อไม่ให้ชี้นำ
    var showCounts = phase !== 'open';
    var tiles = $('tiles');
    tiles.innerHTML = '';
    q.options.forEach(function (o, i) {
      var t = el('div', 'tile c' + (i % 4));
      t.appendChild(el('span', 'key', o.key));
      t.appendChild(el('span', null, o.text));
      if (showCounts) {
        var n = aIds.filter(function (id) { return cur[id].choice === o.key; }).length;
        t.appendChild(el('span', 'n', String(n)));
      }
      if (phase === 'reveal' && session.correct !== o.key) t.classList.add('dim');
      tiles.appendChild(t);
    });

    $('answered').textContent = phase === 'reveal'
      ? 'ข้อที่ถูกคือ ' + session.correct + (rev && rev.scored === false ? ' (ข้อนี้ไม่นับคะแนน)' : '')
      : 'ตอบแล้ว ' + aIds.length + ' จาก ' + Math.max(joined, aIds.length) + ' คน';

    // ตารางคะแนนรวมทุกสาขาที่เฉลยแล้ว แสดงหลังเฉลยเท่านั้น
    $('board').hidden = phase !== 'reveal';
    if (phase !== 'reveal') return;
    $('scoreHead').textContent = session.final ? 'สรุปผลคะแนนรวม' : 'คะแนนรวม';
    var rows = totals(session.revealed);
    var body = $('boardBody');
    body.innerHTML = '';
    if (!rows.length) {
      var tr0 = el('tr'); var td0 = el('td', 'muted', 'ยังไม่มีใครตอบถูก'); td0.colSpan = 3;
      tr0.appendChild(td0); body.appendChild(tr0);
    }
    rows.slice(0, 10).forEach(function (r, i) {
      var tr = el('tr');
      tr.appendChild(el('td', null, String(i + 1)));
      tr.appendChild(el('td', null, r.name));
      tr.appendChild(el('td', 'n', String(r.score)));
      body.appendChild(tr);
    });
  }

  // นับถอยหลัง และปิดรับคำตอบเองเมื่อหมดเวลา
  var closing = false;
  setInterval(function () {
    if (session.phase !== 'open' || !session.openedAt) { closing = false; return; }
    var dur = session.duration * 1000;
    var left = Math.max(0, session.openedAt + dur - now());
    $('timerNum').textContent = Math.ceil(left / 1000);
    $('timerFill').style.transform = 'scaleX(' + (left / dur) + ')';
    if (left <= 0 && !closing) { closing = true; closeRound(); }
  }, 200);
})();
</script>
</body>
</html>
