<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตอบคำถามท้ายคลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <h1 id="title">ตอบคำถามท้ายคลิป</h1>
    <div class="branch" id="branchName"></div>
  </header>

  <!-- ไม่ได้ระบุสาขาในลิงก์ -->
  <section class="panel" id="picker" hidden>
    <h2>เลือกสาขา</h2>
    <div class="picker" id="pickerList"></div>
  </section>

  <!-- ใส่ชื่อ -->
  <section class="panel" id="join" hidden>
    <h2>ใส่ชื่อเล่นเพื่อเข้าร่วม</h2>
    <p class="muted">ชื่อนี้จะขึ้นบนตารางคะแนน</p>
    <label for="nameInput">ชื่อเล่น</label>
    <div class="row">
      <input type="text" id="nameInput" maxlength="24" autocomplete="nickname" style="flex:1; min-width:200px">
      <button class="btn" id="joinBtn">เข้าร่วม</button>
    </div>
    <div class="error" id="joinError" hidden></div>
  </section>

  <!-- คำถาม / รอ / เฉลย -->
  <section class="panel" id="stage" hidden aria-live="polite"></section>

  <div class="error" id="fatal" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="quiz-config.js"></script>
<script>
(function () {
  var cfg = window.QUIZ_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var bKey = (new URLSearchParams(location.search).get('b') || '').toUpperCase();
  var branch = cfg.branches[bKey];

  $('title').textContent = cfg.eventTitle;
  document.title = cfg.eventTitle;

  // ---------- ไม่มีสาขาในลิงก์: ให้เลือก ----------
  if (!branch) {
    Object.keys(cfg.branches).forEach(function (k) {
      var a = document.createElement('a');
      a.href = '?b=' + encodeURIComponent(k);
      a.textContent = k;
      var s = document.createElement('span');
      s.textContent = cfg.branches[k].name;
      a.appendChild(s);
      $('pickerList').appendChild(a);
    });
    $('picker').hidden = false;
    return;
  }
  $('branchName').textContent = branch.name && branch.name !== bKey ? bKey + ' ' + branch.name : bKey;

  // ---------- สถานะของหน้านี้ ----------
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var uid = null;
  var name = store.get('quiz-name') || '';
  var session = { phase: 'waiting' };
  var round = null;        // รหัสรอบปัจจุบัน เปลี่ยนเมื่อผู้ดูแลกดเริ่มรอบใหม่
  var myAnswers = {};      // คำตอบของฉันแยกตามข้อ เช่น { q0: {...}, q1: {...} }
  var questions = window.quizQuestions(branch);
  function curKey() { return session.qKey || 'q0'; }
  function curIndex() { var i = parseInt(curKey().slice(1), 10); return i >= 0 && i < questions.length ? i : 0; }
  function curQ() { return questions[curIndex()]; }
  function mine() { return myAnswers[curKey()] || null; }
  function qTitle() {
    return (questions.length > 1 ? 'ข้อ ' + (curIndex() + 1) + ' จาก ' + questions.length + ': ' : '') + curQ().question;
  }
  function scoreOf(key) {
    var rev = session.revealed && session.revealed[key], a = myAnswers[key];
    return rev && a && a.choice === rev.correct ? window.quizScore(a.at, rev.openedAt, rev.duration) : 0;
  }
  var offset = 0;          // ส่วนต่างเวลาเครื่องนี้กับเซิร์ฟเวอร์
  var sending = false;
  var db;

  function now() { return Date.now() + offset; }
  function fatal(msg) { $('fatal').textContent = msg; $('fatal').hidden = false; }

  // ---------- Firebase ----------
  try {
    firebase.initializeApp(cfg.firebase);
    db = firebase.firestore();
  } catch (e) {
    fatal('เชื่อมต่อระบบไม่ได้ ตรวจค่า firebase ในไฟล์ quiz-config.js');
    return;
  }

  var started = false;
  firebase.auth().onAuthStateChanged(function (user) {
    if (!user) {
      // ยังไม่มีตัวตนในเบราว์เซอร์นี้: สร้างแบบไม่ระบุชื่อ
      firebase.auth().signInAnonymously().catch(function () {
        fatal('เข้าสู่ระบบไม่ได้ ตรวจว่าเปิด Anonymous sign-in ใน Firebase แล้ว');
      });
      return;
    }
    if (started) return;
    started = true;
    uid = user.uid;
    db.collection('sessions').doc(bKey).onSnapshot(function (snap) {
      session = normalize(snap.exists ? snap.data() : null);
      if (session.round !== round) {
        // รอบใหม่ (หรือเพิ่งเปิดหน้า): โหลดคำตอบที่เคยส่งในรอบนี้ และลงชื่อเข้าร่วมรอบนี้
        round = session.round;
        myAnswers = loadAnswers(round);
        sending = false;
        if (name && round) registerPlayer();
      }
      render();
    }, function () {
      fatal('เชื่อมต่อฐานข้อมูลไม่ได้ ลองรีเฟรชหน้านี้');
    });
    render();
  });

  // แปลงข้อมูลรอบจาก Firestore ให้ใช้ง่าย (เวลาเป็นมิลลิวินาที)
  function normalize(d) {
    d = d || {};
    return {
      phase: d.phase || 'waiting',
      qKey: d.qKey || 'q0',
      openedAt: d.openedAt && d.openedAt.toMillis ? d.openedAt.toMillis() : 0,
      duration: d.duration || cfg.answerSeconds,
      correct: d.correct || null,
      revealed: d.revealed || {},
      round: d.round || ''
    };
  }

  // คำตอบที่ส่งแล้วเก็บไว้ในเครื่อง เพื่อไม่ต้องอ่านจากฐานข้อมูลซ้ำ
  var ANS_KEY = 'quiz-ans-' + bKey;
  function loadAnswers(r) {
    try {
      var saved = JSON.parse(store.get(ANS_KEY) || 'null');
      return saved && saved.round === r ? saved.answers : {};
    } catch (e) { return {}; }
  }
  function saveAnswers() { store.set(ANS_KEY, JSON.stringify({ round: round, answers: myAnswers })); }

  function registerPlayer() {
    if (!uid || !round) return;
    var ref = db.collection('sessions').doc(bKey).collection('players').doc(uid);
    var t0 = Date.now();
    ref.set({ name: name, round: round, joinedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function () { return ref.get({ source: 'server' }); })
      .then(function (snap) {
        // ใช้เวลาที่เซิร์ฟเวอร์บันทึก ปรับนาฬิกานับถอยหลังของเครื่องนี้ให้ตรงกับเซิร์ฟเวอร์
        var t = snap.data() && snap.data().joinedAt;
        if (t && t.toMillis) offset = t.toMillis() - (t0 + Date.now()) / 2;
      })
      .catch(function () {});
  }

  // ---------- ใส่ชื่อ ----------
  $('nameInput').value = name;
  function join() {
    var v = $('nameInput').value.trim().slice(0, 24);
    if (!v) {
      $('joinError').textContent = 'พิมพ์ชื่อเล่นก่อนกดเข้าร่วม';
      $('joinError').hidden = false;
      return;
    }
    name = v;
    store.set('quiz-name', name);
    registerPlayer();
    render();
  }
  $('joinBtn').addEventListener('click', join);
  $('nameInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') join(); });

  // ---------- วาดหน้าจอ ----------
  var tick = null;

  function el(tagName, cls, text) {
    var n = document.createElement(tagName);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function waiting(title, sub) {
    var box = el('div', 'center');
    var h = el('h2');
    h.appendChild(el('span', 'pulse'));
    h.appendChild(document.createTextNode(title));
    box.appendChild(h);
    if (sub) box.appendChild(el('p', 'muted', sub));
    return box;
  }

  function optionButtons(opts) {
    // opts: { disabled, picked, correct }
    var grid = el('div', 'options');
    curQ().options.forEach(function (o, i) {
      var b = el('button', 'opt c' + (i % 4));
      b.type = 'button';
      b.appendChild(el('span', 'key', o.key));
      b.appendChild(el('span', 'txt', o.text));
      b.disabled = !!opts.disabled;
      if (opts.picked && opts.picked === o.key) b.classList.add('picked');
      if (opts.picked && opts.picked !== o.key && !opts.correct) b.classList.add('dim');
      if (opts.correct && opts.correct !== o.key) b.classList.add('dim');
      if (!opts.disabled) b.addEventListener('click', function () { submit(o.key); });
      grid.appendChild(b);
    });
    return grid;
  }

  function submit(key) {
    if (sending || mine() || !uid || !round) return;
    sending = true;
    render();
    var q = curKey(), r = round;
    var ref = db.collection('sessions').doc(bKey).collection('answers').doc(r + '_' + q + '_' + uid);
    var sentAt = now();
    ref.set({
      round: r, q: q, uid: uid, choice: key, name: name,
      at: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      // บันทึกสำเร็จ: จำคำตอบไว้ในเครื่อง แล้วขอเวลาที่เซิร์ฟเวอร์บันทึกจริงเพื่อคิดคะแนนให้ตรงกับจอ
      if (r !== round) return;
      myAnswers[q] = { choice: key, at: sentAt };
      saveAnswers();
      sending = false;
      render();
      return ref.get({ source: 'server' }).then(function (snap) {
        var t = snap.data() && snap.data().at;
        if (t && t.toMillis && r === round && myAnswers[q]) {
          myAnswers[q].at = t.toMillis();
          saveAnswers();
          render();
        }
      }).catch(function () {});
    }).catch(function () {
      sending = false;
      render();
      $('stage').appendChild(el('div', 'error', 'ส่งคำตอบไม่ได้ อาจหมดเวลาหรือสัญญาณหลุด ลองกดอีกครั้ง'));
    });
  }

  function render() {
    if (tick) { clearInterval(tick); tick = null; }
    var stage = $('stage');
    stage.innerHTML = '';

    if (!name) {
      $('join').hidden = false; stage.hidden = true;
      return;
    }
    $('join').hidden = true;

    var phase = session.phase || 'waiting';
    var myAnswer = mine();

    // เฉลยแล้ว: แสดงผลให้ทุกคน
    if (phase === 'reveal') {
      stage.hidden = false;
      stage.appendChild(el('h2', null, qTitle()));
      var box = el('div', 'center');
      var pts = scoreOf(curKey());
      if (!myAnswer) box.appendChild(el('div', 'result', 'ไม่ได้ส่งคำตอบ'));
      else if (myAnswer.choice === session.correct) box.appendChild(el('div', 'result ok', 'ตอบถูก'));
      else box.appendChild(el('div', 'result bad', 'ยังไม่ถูก'));
      box.appendChild(el('div', 'score', String(pts)));
      box.appendChild(el('div', 'muted', questions.length > 1 ? 'คะแนนข้อนี้' : 'คะแนน'));
      if (questions.length > 1) {
        var total = 0;
        Object.keys(session.revealed || {}).forEach(function (k) { total += scoreOf(k); });
        box.appendChild(el('p', null, 'คะแนนรวม ' + total));
      }
      stage.appendChild(box);
      stage.appendChild(el('p', 'muted', 'ข้อที่ถูกคือ ' + session.correct));
      stage.appendChild(optionButtons({ disabled: true, picked: myAnswer && myAnswer.choice, correct: session.correct }));
      return;
    }

    stage.hidden = false;

    if (phase === 'waiting') {
      stage.appendChild(waiting('เข้าร่วมแล้ว รอผู้ดูแลเปิดรับคำตอบ', 'ตัวเลือกจะขึ้นที่หน้านี้เอง ไม่ต้องรีเฟรช'));
      return;
    }

    if (phase === 'closed') {
      stage.appendChild(el('h2', null, qTitle()));
      stage.appendChild(waiting('ปิดรับคำตอบแล้ว', myAnswer ? 'ส่งคำตอบข้อ ' + myAnswer.choice + ' แล้ว รอเฉลย' : 'รอเฉลย'));
      return;
    }

    // phase === 'open'
    stage.appendChild(el('h2', null, qTitle()));
    var endAt = (session.openedAt || now()) + (session.duration || cfg.answerSeconds) * 1000;

    if (myAnswer) {
      stage.appendChild(waiting('ส่งคำตอบข้อ ' + myAnswer.choice + ' แล้ว', 'รอผู้ดูแลเฉลย'));
      stage.appendChild(optionButtons({ disabled: true, picked: myAnswer.choice }));
      return;
    }

    var timer = el('div', 'timer');
    var num = el('div', 'num', '');
    var track = el('div', 'track');
    var fill = el('div', 'fill');
    track.appendChild(fill);
    timer.appendChild(num); timer.appendChild(track);
    stage.appendChild(timer);

    var timeUp = now() >= endAt;
    var grid = optionButtons({ disabled: timeUp || sending });
    stage.appendChild(grid);

    function update() {
      var left = Math.max(0, endAt - now());
      num.textContent = Math.ceil(left / 1000);
      fill.style.transform = 'scaleX(' + (left / ((session.duration || cfg.answerSeconds) * 1000)) + ')';
      if (left <= 0) {
        clearInterval(tick); tick = null;
        Array.prototype.forEach.call(grid.children, function (b) { b.disabled = true; b.classList.add('dim'); });
        stage.appendChild(el('p', 'muted center', 'หมดเวลาตอบ รอเฉลย'));
      }
    }
    update();
    if (!timeUp) tick = setInterval(update, 200);
  }

  render();
})();
</script>
</body>
</html>
